name: gopharma-production

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --api.dashboard=false
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - public
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_PROXY_TARGET: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=gopharma-production_public
      - traefik.http.routers.gopharma-prod-frontend.rule=Host(`${FRONTEND_HOST}`)
      - traefik.http.routers.gopharma-prod-frontend.entrypoints=websecure
      - traefik.http.routers.gopharma-prod-frontend.tls.certresolver=letsencrypt
      - traefik.http.routers.gopharma-prod-frontend.middlewares=gopharma-prod-security-headers@docker
      - traefik.http.services.gopharma-prod-frontend.loadbalancer.server.port=3000
      - traefik.http.middlewares.gopharma-prod-security-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.gopharma-prod-security-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.gopharma-prod-security-headers.headers.stsPreload=true
      - traefik.http.middlewares.gopharma-prod-security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.gopharma-prod-security-headers.headers.browserXssFilter=true
    networks:
      - public
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: "3000"
      API_PREFIX: api
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE:-gopharma}?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=gopharma-production_public
      - traefik.http.routers.gopharma-prod-api.rule=Host(`${API_HOST}`)
      - traefik.http.routers.gopharma-prod-api.entrypoints=websecure
      - traefik.http.routers.gopharma-prod-api.tls.certresolver=letsencrypt
      - traefik.http.routers.gopharma-prod-api.middlewares=gopharma-prod-security-headers@docker
      - traefik.http.services.gopharma-prod-api.loadbalancer.server.port=3000
    networks:
      - public
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mongo:
    image: mongo:7.0.12
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mongo-data:/data/db
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  public:
  internal:
    internal: true

volumes:
  mongo-data:
  traefik-letsencrypt: