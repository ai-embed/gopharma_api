services:
  - type: web
    name: gopharma-api
    runtime: node
    buildCommand: npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
      - key: CORS_ORIGINS
        value: "*"
      - key: MONGODB_URI
        sync: false
