name: gopharma-test

services:
  traefik:
    image: traefik:v3.1
    restart: always
    env_file:
      - .env.test
    command:
      - --api.dashboard=false
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public

  frontend:
    build:
      context: ../go_pharma
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://api:3000
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    image: gopharma-frontend-local
    restart: always
    env_file:
      - .env.test
    environment:
      APP_ENV: test
      NODE_ENV: test
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_PROXY_TARGET: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=gopharma-test_public
      - traefik.http.routers.gopharma-frontend.rule=Host(`localhost`)
      - traefik.http.routers.gopharma-frontend.entrypoints=web
      - traefik.http.services.gopharma-frontend.loadbalancer.server.port=3000
    networks:
      - public
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gopharma-api-local
    restart: always
    env_file:
      - .env.test
    environment:
      APP_ENV: test
      NODE_ENV: test
      PORT: "3000"
      API_PREFIX: api
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-change_me}@mongo:27017/${MONGO_DATABASE:-gopharma_test}?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=gopharma-test_public
      - traefik.http.routers.gopharma-api.rule=Host(`localhost`) && PathPrefix(`/api`)
      - traefik.http.routers.gopharma-api.entrypoints=web
      - traefik.http.services.gopharma-api.loadbalancer.server.port=3000
    networks:
      - public
      - internal

  mongo:
    image: mongo:7.0.12
    restart: always
    env_file:
      - .env.test
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongo-data:/data/db
    networks:
      - internal

networks:
  public:
  internal:
    internal: true

volumes:
  mongo-data:
  traefik-letsencrypt: