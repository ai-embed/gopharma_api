name: gopharma-api-test

services:
  mongo-test:
    image: mongo:7.0
    env_file:
      - ${API_TEST_ENV_FILE:-.env.api-test.example}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "db.adminCommand('ping').ok"
          "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin" | grep 1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api-test-runner:
    init: true
    build:
      context: ./go_pharma_api
      dockerfile: Dockerfile.dev
    env_file:
      - ${API_TEST_ENV_FILE:-.env.api-test.example}
    depends_on:
      mongo-test:
        condition: service_healthy
    command:
      - sh
      - -lc
      - |
        set -e
        npm run lint:check
        npm test -- --runInBand
        npm run test:integration -- --runInBand
        npm run test:e2e -- --runInBand
